<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f5f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Mémo — learn French from A1 to B2: grammar lessons, graded reading and spaced-repetition flashcards in one app.">
<title>Mémo — French</title>
<link rel="icon" href="icons/memo-logo.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Mémo">
<meta name="application-name" content="Mémo">
<style>
  :root { color-scheme: light; --bar: 4rem; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --brand: #4f46e5; --brand-ink: #4338ca; --brand-soft: #e0e7ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    background: #f1f5f9; color: #1e293b;
    display: flex; flex-direction: column; height: 100vh; height: 100dvh;
    padding-top: env(safe-area-inset-top);
  }
  button { font: inherit; }
  .serif { font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  #stage { position: relative; flex: 1; min-height: 0; }
  #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #f1f5f9; }
  #stage iframe.active { display: block; }

  /* ---------- Home ---------- */
  #home {
    position: absolute; inset: 0; overflow-y: auto; display: none;
    background: radial-gradient(1100px 520px at 50% -180px, #e0e7ff 0%, rgba(224,231,255,0) 70%), #f1f5f9;
  }
  #home.active { display: block; animation: rise .3s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .home-inner { max-width: 48rem; margin: 0 auto; padding: 1rem 1rem 2rem; }
  .brand { display: flex; align-items: center; gap: .75rem; padding: .5rem 0; }
  .logo { width: 2.5rem; height: 2.5rem; border-radius: .8rem; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 1.25rem; font-weight: 700; box-shadow: 0 4px 10px -4px #a5b4fc; }
  .brand h1 { margin: 0; font-size: 1.1rem; letter-spacing: -.01em; color: var(--ink); }
  .brand p { margin: 0; font-size: .75rem; color: var(--muted); }
  .greet { margin: 1.25rem 0 0; font-size: 1.9rem; font-weight: 600; letter-spacing: -.02em; color: var(--ink); }
  .greet-sub { margin: .25rem 0 0; font-size: .9rem; color: var(--muted); }

  .apps { display: grid; gap: .75rem; margin-top: 1.25rem; }
  @media (min-width: 40rem) { .apps { grid-template-columns: repeat(3, 1fr); } }
  .app-card {
    display: flex; flex-direction: column; text-align: left; cursor: pointer;
    background: #fff; border: 1px solid var(--line); border-radius: 1.25rem; padding: 1rem;
    transition: transform .15s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .app-card:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -18px rgba(30,41,59,.35); border-color: #c7d2fe; }
  .app-card:active { transform: scale(.985); }
  .app-card:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 2px; }
  .app-top { display: flex; align-items: center; gap: .75rem; }
  .app-icon { width: 2.75rem; height: 2.75rem; border-radius: .9rem; display: grid; place-items: center; flex: none; }
  .app-icon svg { width: 1.4rem; height: 1.4rem; }
  .app-name { margin: 0; font-size: 1.15rem; font-weight: 600; color: var(--ink); }
  .app-what { margin: 0; font-size: .75rem; color: var(--muted); }
  .app-desc { margin: .75rem 0 0; font-size: .85rem; line-height: 1.45; color: #475569; flex: 1; }
  .app-stat { margin: .75rem 0 0; font-size: .75rem; font-weight: 600; }
  .app-go { margin-top: .75rem; display: flex; align-items: center; justify-content: space-between; font-size: .8rem; font-weight: 600; color: var(--brand-ink); }
  .app-go svg { width: 1rem; height: 1rem; }

  .cont-title { margin: 1.75rem 0 0; font-size: .75rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .continue { display: grid; gap: .5rem; margin-top: .6rem; }
  .cont {
    display: flex; align-items: center; gap: .75rem; width: 100%; text-align: left; cursor: pointer;
    background: #fff; border: 1px solid var(--line); border-radius: 1rem; padding: .75rem .9rem;
    transition: border-color .2s ease, transform .12s ease;
  }
  .cont:hover { border-color: #c7d2fe; }
  .cont:active { transform: scale(.985); }
  .cont .dot { width: 2.25rem; height: 2.25rem; border-radius: .7rem; display: grid; place-items: center; flex: none; }
  .cont .dot svg { width: 1.1rem; height: 1.1rem; }
  .cont .k { display: block; font-size: .7rem; font-weight: 600; }
  .cont .t { display: block; font-size: .9rem; font-weight: 600; color: var(--ink); line-height: 1.3; }
  .cont .chev { margin-left: auto; color: #cbd5e1; flex: none; width: 1rem; height: 1rem; }
  .tip { margin: 1.5rem 0 0; font-size: .75rem; color: #94a3b8; text-align: center; line-height: 1.5; }

  /* ---------- Tab bar ---------- */
  nav#tabs {
    flex: none; display: flex; justify-content: center;
    background: rgba(255,255,255,.92); -webkit-backdrop-filter: saturate(1.4) blur(12px); backdrop-filter: saturate(1.4) blur(12px);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
  }
  .tabs-inner { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; max-width: 36rem; }
  .tab {
    appearance: none; border: 0; background: none; cursor: pointer;
    height: var(--bar); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2rem;
    font-size: .7rem; font-weight: 600; color: var(--muted); transition: color .2s ease, transform .12s ease;
  }
  .tab:active { transform: scale(.95); }
  .tab svg, .ic { width: 1.35rem; height: 1.35rem; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .tab .pill { display: grid; place-items: center; width: 3.4rem; height: 1.9rem; border-radius: 999px; transition: background-color .2s ease; }
  .tab[aria-selected="true"] { color: var(--brand-ink); }
  .tab[aria-selected="true"] .pill { background: var(--brand-soft); }
  .tab:focus-visible { outline: 2px solid #a5b4fc; outline-offset: -4px; border-radius: 1rem; }

  #loading[hidden] { display: none; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  #loading span { width: 2rem; height: 2rem; border-radius: 999px; border: 3px solid #c7d2fe; border-top-color: var(--brand); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .tab, .tab .pill, .app-card, .cont { transition: none; } #home.active, #loading span { animation: none; } }
</style>
</head>
<body>
  <main id="stage">
    <!-- ======================= HOME ======================= -->
    <section id="home" aria-labelledby="home-greet">
      <div class="home-inner">
        <header class="brand">
          <div class="logo serif" aria-hidden="true">M</div>
          <div><h1>Mémo</h1><p>French from A1 to B2</p></div>
        </header>
        <p id="home-greet" class="greet serif">Bonjour !</p>
        <p class="greet-sub">What would you like to do today?</p>

        <div class="apps" id="apps"></div>

        <h2 class="cont-title" id="cont-title" hidden>Pick up where you left off</h2>
        <div class="continue" id="continue"></div>

        <p class="tip">Inside any lesson, reading or deck, the <strong>Leçon · Lecture · Cartes</strong> bar jumps to the same subject in the other sections.</p>
      </div>
    </section>
    <div id="loading" hidden><span></span></div>
  </main>

  <nav id="tabs" aria-label="Sections">
    <div class="tabs-inner" role="tablist" id="tablist"></div>
  </nav>

<script>
(function () {
  'use strict';
  const ICONS = {
    home: '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    lecons: '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
    lecture: '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/><path d="M8 7h6"/><path d="M8 11h8"/>',
    cartes: '<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
    arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
    chev: '<path d="m9 18 6-6-6-6"/>'
  };
  const icon = (name, cls) => '<svg viewBox="0 0 24 24" class="ic ' + (cls || "") + '" aria-hidden="true">' + ICONS[name] + '</svg>';

  // Each section is its own page in its own folder, kept loaded in a frame so switching keeps your place.
  const APPS = {
    lecons:  { src: "lecons/index.html",  name: "Leçons",  what: "Grammar course",  title: "Leçons — Mémo",  color: "#4338ca", soft: "#e0e7ff",
               desc: "120 subjects from A1 to B2: clear explanations, examples you can listen to, and self-checked exercises." },
    lecture: { src: "lecture/index.html", name: "Lecture", what: "Graded reading",  title: "Lecture — Mémo", color: "#0369a1", soft: "#e0f2fe",
               desc: "Short stories that follow the same characters level by level, with a glossary, questions and writing." },
    cartes:  { src: "cartes/index.html",  name: "Cartes",  what: "Flashcards",      title: "Cartes — Mémo",  color: "#047857", soft: "#d1fae5",
               desc: "Spaced-repetition practice: flashcards, typed answers, fill-in-the-blank and multiple choice." }
  };
  const TABS = [{ id: "home", name: "Accueil" }].concat(Object.keys(APPS).map(id => ({ id: id, name: APPS[id].name })));
  const KEY = "memo-shell-v1";
  const stage = document.getElementById("stage");
  const home = document.getElementById("home");
  const loading = document.getElementById("loading");
  const frames = {};
  let current = null, LINKS = null;

  fetch("shared/links.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : null)
    .then(j => { LINKS = j; if (current === "home") renderHome(); }).catch(() => {});

  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const plural = (n, a, b) => n + " " + (n === 1 ? a : b);

  /* ---------- Home ---------- */
  function stats() {
    const L = store.get("lecons-french-v1"), R = store.get("lecture-french-v1"), C = store.get("memo-french-v2");
    const done = p => p ? Object.keys(p).filter(k => p[k] && p[k].completed).length : 0;
    let mastered = 0, due = 0;
    if (C && C.cards) Object.keys(C.cards).forEach(k => {
      const c = C.cards[k];
      if ((c.box || 0) >= 3) mastered++;
      if ((c.due || 0) <= Date.now()) due++;
    });
    return {
      lecons: L ? plural(done(L.progress), "subject done", "subjects done") + " of 120" : "Start with Subject 1",
      lecture: R ? plural(done(R.progress), "story read", "stories read") + " of 120" : "Start with the first story",
      cartes: C && C.cards && Object.keys(C.cards).length
        ? mastered + " mastered" + (due ? " · " + plural(due, "card", "cards") + " due for review" : "")
        : "Over 4,000 practice items",
      lastSubject: L && L.lastSubject ? Number(String(L.lastSubject).replace(/^s/, "")) : null,
      lastModule: R && R.lastModule ? R.lastModule : null,
      lastDeck: C && C.settings && C.settings.lastDeck ? C.settings.lastDeck : null
    };
  }
  function renderHome() {
    const s = stats();
    document.getElementById("home-greet").textContent = new Date().getHours() < 18 ? "Bonjour !" : "Bonsoir !";
    document.getElementById("apps").innerHTML = Object.keys(APPS).map(id => {
      const a = APPS[id];
      return '<button type="button" class="app-card" data-open="' + id + '" aria-label="Open ' + a.name + ', ' + a.what + '">' +
        '<div class="app-top"><span class="app-icon" style="background:' + a.soft + ';color:' + a.color + '">' + icon(id) + '</span>' +
        '<div><p class="app-name serif">' + a.name + '</p><p class="app-what">' + a.what + '</p></div></div>' +
        '<p class="app-desc">' + a.desc + '</p>' +
        '<p class="app-stat" style="color:' + a.color + '">' + esc(s[id]) + '</p>' +
        '<span class="app-go" style="color:' + a.color + '">Open ' + a.name + icon("arrow") + '</span>' +
      '</button>';
    }).join("");

    const items = [];
    if (LINKS && s.lastSubject && LINKS.subjects[s.lastSubject]) {
      const sub = LINKS.subjects[s.lastSubject];
      items.push({ app: "lecons", hash: "subject-" + s.lastSubject, k: "Leçons · " + sub.level + " · Subject " + s.lastSubject, t: sub.title });
    }
    if (LINKS && s.lastModule && LINKS.modules[s.lastModule]) {
      const m = LINKS.modules[s.lastModule];
      items.push({ app: "lecture", hash: s.lastModule, k: "Lecture · " + m.level + " · Story " + m.number, t: m.title });
    }
    if (LINKS && s.lastDeck) {
      let found = null;
      Object.keys(LINKS.subjects).some(n => LINKS.subjects[n].cartes.some(d => d.id === s.lastDeck && (found = { n: n, d: d })));
      if (found) items.push({ app: "cartes", hash: "deck-" + found.d.id, k: "Cartes · " + LINKS.subjects[found.n].level + " · Subject " + found.n, t: found.d.title });
    }
    document.getElementById("cont-title").hidden = !items.length;
    document.getElementById("continue").innerHTML = items.map((it, i) =>
      '<button type="button" class="cont" data-cont="' + i + '">' +
        '<span class="dot" style="background:' + APPS[it.app].soft + ';color:' + APPS[it.app].color + '">' + icon(it.app) + '</span>' +
        '<span><span class="k" style="color:' + APPS[it.app].color + '">' + esc(it.k) + '</span><span class="t">' + esc(it.t) + '</span></span>' +
        icon("chev", "chev") +
      '</button>').join("");
    document.getElementById("continue").onclick = e => {
      const b = e.target.closest("[data-cont]");
      if (b) { const it = items[Number(b.dataset.cont)]; show(it.app, it.hash); }
    };
  }
  document.getElementById("apps").addEventListener("click", e => {
    const b = e.target.closest("[data-open]");
    if (b) show(b.dataset.open);
  });

  /* ---------- Sections ---------- */
  function frame(app, hash) {
    if (frames[app]) return frames[app];
    const f = document.createElement("iframe");
    f.id = "frame-" + app;
    f.title = APPS[app].title;
    f.setAttribute("allow", "autoplay; clipboard-write");
    loading.hidden = false;
    f.addEventListener("load", () => { if (app === current) loading.hidden = true; }, { once: true });
    f.src = APPS[app].src + (hash ? "#" + hash : "");
    stage.appendChild(f);
    frames[app] = f;
    return f;
  }
  function setHashInFrame(f, hash) {
    try {
      const w = f.contentWindow;
      if (w.location.hash.replace(/^#/, "") === hash) w.dispatchEvent(new HashChangeEvent("hashchange"));
      else w.location.hash = hash;
    } catch (e) { f.src = f.src.split("#")[0] + "#" + hash; }
  }

  function show(app, hash) {
    if (app !== "home" && !APPS[app]) app = "home";
    if (app === "home") {
      Object.keys(frames).forEach(k => frames[k].classList.remove("active"));
      renderHome();
      home.classList.add("active");
      home.scrollTop = 0;
      loading.hidden = true;
      document.title = "Mémo — French";
    } else {
      home.classList.remove("active");
      const isNew = !frames[app];
      const f = frame(app, hash);
      if (!isNew && hash) setHashInFrame(f, hash);
      Object.keys(frames).forEach(k => frames[k].classList.toggle("active", k === app));
      if (!isNew) loading.hidden = true;
      document.title = APPS[app].title;
      try { f.focus({ preventScroll: true }); } catch (e) {}
    }
    current = app;
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.app === app)));
    store.set(KEY, app);
    if (location.hash.replace(/^#/, "") !== app) {
      try { history.replaceState(null, "", app === "home" ? location.pathname + location.search : "#" + app); } catch (e) {}
    }
  }

  // Called by the sections (same origin) to jump to another section, e.g. a lesson's flashcards.
  window.memoShell = { open: (app, hash) => show(app, hash || "") };

  const tablist = document.getElementById("tablist");
  tablist.innerHTML = TABS.map(t =>
    '<button class="tab" role="tab" id="tab-' + t.id + '" data-app="' + t.id + '" aria-selected="false">' +
      '<span class="pill">' + icon(t.id) + '</span>' + t.name + '</button>').join("");
  tablist.addEventListener("click", e => { const t = e.target.closest(".tab"); if (t) show(t.dataset.app); });
  tablist.addEventListener("keydown", e => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    const ids = TABS.map(t => t.id), i = ids.indexOf(current);
    const next = ids[(i + (e.key === "ArrowRight" ? 1 : ids.length - 1)) % ids.length];
    show(next); document.getElementById("tab-" + next).focus();
  });
  window.addEventListener("hashchange", () => {
    const h = location.hash.replace(/^#/, "") || "home";
    if ((APPS[h] || h === "home") && h !== current) show(h);
  });
  // Refresh the home figures when coming back to the app.
  document.addEventListener("visibilitychange", () => { if (!document.hidden && current === "home") renderHome(); });

  const start = location.hash.replace(/^#/, "");
  show(APPS[start] ? start : "home");
})();
</script>
</body>
</html>
